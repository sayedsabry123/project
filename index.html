    // ==================== تصدير PDF ====================
    const PDF_CONFIG = { pageWidth: 1400, pageHeight: 990, pagePaddingY: 25, headerHeight: 120, titleBarHeight: 55, summaryHeight: 90, tableHeaderHeight: 48, rowHeight: 40, footerHeight: 110, safetyMargin: 15 };

    function getReportTitle(type) {
      const titles = { inventory: 'تقرير المخزون الحالي', receipts: 'تقرير الاستلامات', issues: 'تقرير الصرف', lowstock: 'تقرير الأصناف الناقصة', outofstock: 'تقرير الأصناف المنتهية', byperson: 'تقرير حركة الأشخاص', bysection: 'تقرير حسب القسم', period: 'تقرير حسب الفترة الزمنية' };
      return titles[type] || 'تقرير';
    }

    function getReportSummary(type) {
      const summaries = [];
      if (type === 'inventory') { summaries.push({ val: state.items.length, lbl: 'إجمالي الأصناف' }); summaries.push({ val: state.items.reduce((s, i) => s + calculateBalance(i.id).current, 0).toLocaleString(), lbl: 'إجمالي الكميات' }); summaries.push({ val: state.items.filter(i => calculateBalance(i.id).current <= 0).length, lbl: 'أصناف نفدت' }); summaries.push({ val: state.items.filter(i => { const b = calculateBalance(i.id).current; return b > 0 && b <= (i.minQty || 0); }).length, lbl: 'أصناف منخفضة' }); }
      else if (type === 'receipts') { const r = state.movements.filter(m => m.type === 'receipt'); summaries.push({ val: r.length, lbl: 'عدد عمليات الاستلام' }); summaries.push({ val: r.reduce((s, m) => s + (m.qty || 0), 0).toLocaleString(), lbl: 'إجمالي الكميات' }); }
      else if (type === 'issues') { const i = state.movements.filter(m => m.type === 'issue'); summaries.push({ val: i.length, lbl: 'عدد عمليات الصرف' }); summaries.push({ val: i.reduce((s, m) => s + (m.qty || 0), 0).toLocaleString(), lbl: 'إجمالي الكميات' }); }
      else if (type === 'lowstock') { summaries.push({ val: state.items.filter(i => { const b = calculateBalance(i.id).current; return b > 0 && b <= (i.minQty || 0); }).length, lbl: 'عدد الأصناف الناقصة' }); }
      else if (type === 'outofstock') { summaries.push({ val: state.items.filter(i => calculateBalance(i.id).current <= 0).length, lbl: 'عدد الأصناف المنتهية' }); }
      else if (type === 'byperson') { const p = new Set(state.movements.filter(m => m.type === 'issue').map(m => m.person || 'غير محدد')); summaries.push({ val: p.size, lbl: 'عدد الأشخاص' }); summaries.push({ val: state.movements.filter(m => m.type === 'issue').length, lbl: 'إجمالي عمليات السحب' }); }
      else if (type === 'bysection') { summaries.push({ val: state.sections.length, lbl: 'عدد الأقسام' }); summaries.push({ val: state.items.length, lbl: 'إجمالي الأصناف' }); }
      else if (type === 'period') { const from = document.getElementById('periodFrom')?.value || ''; const to = document.getElementById('periodTo')?.value || ''; const f = state.movements.filter(m => m.date >= from && m.date <= to); summaries.push({ val: f.length, lbl: 'عدد الحركات' }); summaries.push({ val: f.filter(m => m.type === 'receipt').length, lbl: 'عمليات استلام' }); summaries.push({ val: f.filter(m => m.type === 'issue').length, lbl: 'عمليات صرف' }); }
      return summaries;
    }

    function extractTableData(type) {
      const table = document.getElementById(`reportTable-${type}`);
      if (!table) return null;
      const headers = Array.from(table.querySelectorAll('thead th')).map(th => th.innerText.trim());
      const rows = [];
      table.querySelectorAll('tbody tr').forEach(tr => {
        if (tr.querySelector('.table-empty') || tr.children.length === 1) return;
        rows.push(Array.from(tr.querySelectorAll('td')).map(td => td.innerText.trim()));
      });
      return { headers, rows };
    }

    function buildPDFPage(type, headers, rows, pageIndex, totalPages, isFirstPage, totalRows) {
      const title = getReportTitle(type);
      const now = new Date();
      const dateStr = now.toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' });
      const timeStr = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
      let headerHTML = `<div class="pdf-header"><div class="pdf-logo">🏗️</div><div class="pdf-company"><h1>نظام إدارة مخزن مواد الموقع</h1><p>Site Warehouse Management System</p></div><div class="pdf-meta"><div><strong>التاريخ:</strong> ${dateStr}</div><div><strong>الوقت:</strong> ${timeStr}</div><div><strong>عدد السجلات:</strong> ${totalRows}</div></div></div>`;
      let titleBarHTML = isFirstPage ? `<div class="pdf-title-bar">${title}</div>` : `<div class="pdf-title-bar" style="font-size:14px;padding:8px 22px;">${title} (تابع) - صفحة ${pageIndex + 1} من ${totalPages}</div>`;
      let summaryHTML = '';
      if (isFirstPage) { const s = getReportSummary(type); if (s.length > 0) summaryHTML = `<div class="pdf-summary">${s.map(x => `<div class="pdf-summary-item"><div class="val">${x.val}</div><div class="lbl">${x.lbl}</div></div>`).join('')}</div>`; }
      const theadHTML = `<thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>`;
      const tbodyHTML = `<tbody>${rows.map(row => `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody>`;
      const footerHTML = `<div class="pdf-footer"><div class="signature"><div class="line">أمين المخزن</div></div><div class="center-info"><div>تم إنشاء هذا التقرير آليًا</div><div style="margin-top:4px;">© ${now.getFullYear()}</div><div class="pdf-page-number">صفحة ${pageIndex + 1} من ${totalPages}</div></div><div class="signature"><div class="line">مدير الموقع</div></div></div>`;
      return `<div class="pdf-page">${headerHTML}${titleBarHTML}${summaryHTML}<div class="pdf-table-wrapper"><table>${theadHTML}${tbodyHTML}</table></div>${footerHTML}</div>`;
    }

    function calculateRowsPerPage() {
      const usableHeight = PDF_CONFIG.pageHeight - (PDF_CONFIG.pagePaddingY * 2);
      const firstPageAvailable = usableHeight - PDF_CONFIG.headerHeight - PDF_CONFIG.titleBarHeight - PDF_CONFIG.summaryHeight - PDF_CONFIG.tableHeaderHeight - PDF_CONFIG.footerHeight - PDF_CONFIG.safetyMargin;
      const nextPageAvailable = usableHeight - PDF_CONFIG.headerHeight - 40 - PDF_CONFIG.tableHeaderHeight - PDF_CONFIG.footerHeight - PDF_CONFIG.safetyMargin;
      return { first: Math.max(5, Math.floor(firstPageAvailable / PDF_CONFIG.rowHeight)), next: Math.max(5, Math.floor(nextPageAvailable / PDF_CONFIG.rowHeight)) };
    }

    async function exportPDF(type) {
      try {
        const tableData = extractTableData(type);
        if (!tableData) { showToast('لا يوجد تقرير', 'warning'); return; }
        const { headers, rows } = tableData;
        if (rows.length === 0) { showToast('لا توجد بيانات', 'warning'); return; }
        showToast('جاري إنشاء PDF...', 'info', 2000);
        const { first, next } = calculateRowsPerPage();
        const pages = [];
        let idx = 0, isFirst = true;
        while (idx < rows.length) { const cap = isFirst ? first : next; pages.push(rows.slice(idx, idx + cap)); idx += cap; isFirst = false; }
        const template = document.getElementById('pdfTemplate');
        const totalPages = pages.length;
        template.innerHTML = pages.map((pr, i) => buildPDFPage(type, headers, pr, i, totalPages, i === 0, rows.length)).join('');
        await new Promise(r => setTimeout(r, 800));
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4', compress: true });
        const pw = pdf.internal.pageSize.getWidth();
        const ph = pdf.internal.pageSize.getHeight();
        const pageEls = template.querySelectorAll('.pdf-page');
        for (let i = 0; i < pageEls.length; i++) {
          const canvas = await html2canvas(pageEls[i], { scale: 2, useCORS: true, backgroundColor: '#ffffff', logging: false, windowWidth: PDF_CONFIG.pageWidth, windowHeight: PDF_CONFIG.pageHeight });
          const imgData = canvas.toDataURL('image/jpeg', 0.92);
          if (i > 0) pdf.addPage();
          pdf.addImage(imgData, 'JPEG', 0, 0, pw, ph);
        }
        pdf.save(`report_${type}_${new Date().toISOString().split('T')[0]}.pdf`);
        template.innerHTML = '';
        showToast(`تم تحميل PDF (${totalPages} صفحة)`, 'success');
      } catch (err) { console.error(err); showToast('خطأ في PDF: ' + err.message, 'error'); document.getElementById('pdfTemplate').innerHTML = ''; }
    }

    function createBackup() {
      const backupData = {
        version: '1.0',
        exportedAt: new Date().toISOString(),
        appName: state.settings.appName || 'نظام إدارة مخزن مواد الموقع',
        data: {
          sections: state.sections, items: state.items, movements: state.movements,
          people: state.people, suppliers: state.suppliers, auditLog: state.auditLog, settings: state.settings
        }
      };
      const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `warehouse_backup_${new Date().toISOString().split('T')[0]}.json`;
      link.click();
      state.settings.lastBackup = new Date().toISOString();
      updateInFirebase('settings', 'lastBackup', new Date().toISOString());
      addAuditLog('نسخ احتياطي', 'تم إنشاء نسخة احتياطية');
      showToast('تم إنشاء النسخة الاحتياطية بنجاح', 'success');
      navigateTo('backup');
    }

    function restoreBackup(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const backup = JSON.parse(e.target.result);
          if (!backup.data) throw new Error('ملف غير صالح');
          const d = backup.data;
          const summary = `
            <div class="alert alert-info">
              <span class="alert-icon">📋</span>
              <div>
                <strong>ملخص النسخة:</strong><br>
                تاريخ التصدير: ${backup.exportedAt ? new Date(backup.exportedAt).toLocaleString('ar-EG') : 'غير معروف'}<br>
                الأقسام: ${(d.sections || []).length} | الأصناف: ${(d.items || []).length}<br>
                الحركات: ${(d.movements || []).length} | الأشخاص: ${(d.people || []).length}
              </div>
            </div>
            <div class="alert alert-danger">
              <span class="alert-icon">⚠️</span>
              <div>سيتم <strong>استبدال جميع البيانات على Firebase</strong> بالنسخة الاحتياطية. هل أنت متأكد؟</div>
            </div>
          `;
          openModal('📥 استرجاع نسخة احتياطية', summary, `
            <button class="btn btn-outline" onclick="closeModal()">إلغاء</button>
            <button class="btn btn-danger" onclick="confirmRestore(${JSON.stringify(JSON.stringify(backup))})">📥 استرجاع</button>
          `);
        } catch (err) { showToast('ملف غير صالح: ' + err.message, 'error'); }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    async function confirmRestore(backupJson) {
      try {
        const backup = JSON.parse(backupJson);
        const d = backup.data;

        // تحويل arrays إلى objects بمفاتيح id
        const toObj = (arr) => {
          const obj = {};
          (arr || []).forEach(item => { if (item && item.id) obj[item.id] = item; });
          return obj;
        };

        const newData = {
          sections: toObj(d.sections),
          items: toObj(d.items),
          movements: toObj(d.movements),
          people: toObj(d.people),
          suppliers: toObj(d.suppliers),
          auditLog: toObj(d.auditLog),
          settings: d.settings || {}
        };

        // حذف جميع البيانات الحالية أولًا
        await db.ref(ROOT_PATH).remove();
        // إعادة رفع البيانات
        await db.ref(ROOT_PATH).set(newData);
        await addAuditLog('استرجاع نسخة احتياطية', 'تم استرجاع البيانات من نسخة احتياطية');
        closeModal();
        showToast('تم استرجاع البيانات بنجاح', 'success');
        navigateTo('dashboard');
      } catch (e) { console.error(e); showToast('حدث خطأ أثناء الاسترجاع', 'error'); }
    }

        <div class="table-container mt-3">
          <div class="table-header"><h3>📊 إحصائيات سريعة</h3></div>
          <div style="padding: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px;">
            <div class="detail-card">
              <div class="detail-value">${state.sections.length}</div>
              <div class="detail-label">الأقسام</div>
            </div>
            <div class="detail-card">
              <div class="detail-value">${state.items.length}</div>
              <div class="detail-label">الأصناف</div>
            </div>
            <div class="detail-card">
              <div class="detail-value">${state.movements.length}</div>
              <div class="detail-label">الحركات</div>
            </div>
            <div class="detail-card">
              <div class="detail-value">${state.people.length}</div>
              <div class="detail-label">الأشخاص</div>
            </div>
          </div>
        </div>
      `;
      content.innerHTML = html;
    }

    async function checkFirebaseConnection() {
      showToast('جاري اختبار الاتصال...', 'info', 1500);
      try {
        await db.ref('.info/connected').once('value');
        const testRef = db.ref(`${ROOT_PATH}/_healthcheck`);
        await testRef.set({ ts: Date.now() });
        await testRef.remove();
        showToast('✅ الاتصال بـ Firebase يعمل بشكل ممتاز', 'success');
      } catch (e) {
        showToast('❌ فشل الاتصال: ' + e.message, 'error');
      }
    }

    function clearAllData() {
      openModal('🗑️ مسح جميع البيانات', `
        <div class="alert alert-danger">
          <span class="alert-icon">⚠️</span>
          <div>
            <strong>تحذير خطير!</strong><br>
            سيتم حذف جميع البيانات من Firebase نهائيًا:<br>
            • ${state.sections.length} قسم<br>
            • ${state.items.length} صنف<br>
            • ${state.movements.length} حركة<br>
            • ${state.people.length} شخص<br><br>
            لا يمكن التراجع! هل أنت متأكد؟
          </div>
        </div>
      `, `
        <button class="btn btn-outline" onclick="closeModal()">إلغاء</button>
        <button class="btn btn-danger" onclick="confirmClearAll()">🗑️ نعم، امسح الكل</button>
      `);
    }

    async function confirmClearAll() {
      try {
        // حذف كل شيء ما عدا الأقسام الافتراضية
        await db.ref(ROOT_PATH).remove();

        // إعادة إنشاء الأقسام الافتراضية
        const defaultSectionsObj = {};
        DEFAULT_SECTIONS.forEach(s => { defaultSectionsObj[s.id] = s; });
        await db.ref(`${ROOT_PATH}/sections`).set(defaultSectionsObj);
        await db.ref(`${ROOT_PATH}/settings`).set({
          appName: 'نظام إدارة مخزن مواد الموقع',
          initialized: true,
          createdAt: new Date().toISOString()
        });

        closeModal();
        showToast('تم مسح جميع البيانات وإعادة التهيئة', 'success');
        navigateTo('dashboard');
      } catch (e) {
        console.error(e);
        showToast('خطأ في المسح: ' + e.message, 'error');
      }
    }

    // ==================== اختصارات لوحة المفاتيح ====================
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { closeModal(); closeSidebar(); }
    });

    window.addEventListener('resize', () => {
      if (window.innerWidth > 768) closeSidebar();
    });

    // ==================== تصدير الدوال ====================
    window.toggleSidebar = toggleSidebar;
    window.closeSidebar = closeSidebar;
    window.navigateTo = navigateTo;
    window.closeModal = closeModal;
    window.openAddItemModal = openAddItemModal;
    window.saveNewItem = saveNewItem;
    window.editItem = editItem;
    window.saveEditItem = saveEditItem;
    window.deleteItem = deleteItem;
    window.confirmDeleteItem = confirmDeleteItem;
    window.viewItemDetail = viewItemDetail;
    window.openReceiptModal = openReceiptModal;
    window.saveReceipt = saveReceipt;
    window.openIssueModal = openIssueModal;
    window.saveIssue = saveIssue;
    window.editMovement = editMovement;
    window.saveEditMovement = saveEditMovement;
    window.deleteMovement = deleteMovement;
    window.confirmDeleteMovement = confirmDeleteMovement;
    window.addNewSection = addNewSection;
    window.saveNewSection = saveNewSection;
    window.deleteSection = deleteSection;
    window.confirmDeleteSection = confirmDeleteSection;
    window.openAddPersonModal = openAddPersonModal;
    window.saveNewPerson = saveNewPerson;
    window.editPerson = editPerson;
    window.saveEditPerson = saveEditPerson;
    window.deletePerson = deletePerson;
    window.confirmDeletePerson = confirmDeletePerson;
    window.showReport = showReport;
    window.printReport = printReport;
    window.exportCSV = exportCSV;
    window.exportPDF = exportPDF;
    window.filterPeriodReport = filterPeriodReport;
    window.createBackup = createBackup;
    window.restoreBackup = restoreBackup;
    window.confirmRestore = confirmRestore;
    window.clearAllData = clearAllData;
    window.confirmClearAll = confirmClearAll;
    window.filterSectionItems = filterSectionItems;
    window.filterAllItems = filterAllItems;
    window.filterMovements = filterMovements;
    window.updateReceiptItems = updateReceiptItems;
    window.updateReceiptInfo = updateReceiptInfo;
    window.updateIssueItems = updateIssueItems;
    window.updateIssueInfo = updateIssueInfo;
    window.checkFirebaseConnection = checkFirebaseConnection;
  </script>
</body>
</html>
