<script>
/* ============================================================
   FIREBASE INIT
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyDvjVIixOJrad9BwgQYB2X2X4El63iGHkg",
  authDomain: "sssww-21655.firebaseapp.com",
  databaseURL: "https://sssww-21655-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "sssww-21655",
  storageBucket: "sssww-21655.firebasestorage.app",
  messagingSenderId: "438414670623",
  appId: "1:438414670623:web:2c51a01627fe231cf70e2a",
  measurementId: "G-75KGD2QM1K"
};

let FB = null;
let FB_ROOT = 'makhzany_vip';
let fbOnline = false;
let fbReady = false;

function initFirebase(){
  try{
    if(typeof firebase === 'undefined'){ console.warn('Firebase SDK not loaded'); return; }
    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    FB = firebase.database();
    fbReady = true;
    FB.ref('.info/connected').on('value', snap=>{
      fbOnline = !!snap.val();
      Cloud.setStatus(fbOnline ? 'online' : 'offline');
      if(fbOnline){
        Cloud.pushAll();
      }
    });
  }catch(e){
    console.error('Firebase init error:', e);
    Cloud.setStatus('offline');
  }
}

/* ============================================================
   DATA SERVICE LAYER (Local + Cloud مزامنة تلقائية)
   ============================================================ */
const DB = (() => {
  const KEYS = {
    products:'wh_products', receipts:'wh_receipts', issues:'wh_issues',
    stockMovements:'wh_movements', users:'wh_users', projects:'wh_projects',
    returns:'wh_returns', inventoryChecks:'wh_inventory', settings:'wh_settings',
    meta:'wh_meta', currentUser:'wh_current_user'
  };
  function read(key, def=[]){ try{ const v=localStorage.getItem(key); return v?JSON.parse(v):def; }catch(e){ return def; } }
  function write(key,val){
    localStorage.setItem(key, JSON.stringify(val));
    Cloud.push(key, val);
  }
  return {
    KEYS,
    get:(k,d)=>read(k,d),
    set:(k,v)=>write(k,v),
    uid:(prefix='ID')=> prefix+'-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).substr(2,4).toUpperCase(),
    getProducts:()=>read(KEYS.products,[]),
    saveProducts:(v)=>write(KEYS.products,v),
    getReceipts:()=>read(KEYS.receipts,[]),
    saveReceipts:(v)=>write(KEYS.receipts,v),
    getIssues:()=>read(KEYS.issues,[]),
    saveIssues:(v)=>write(KEYS.issues,v),
    getMovements:()=>read(KEYS.stockMovements,[]),
    saveMovements:(v)=>write(KEYS.stockMovements,v),
    getUsers:()=>read(KEYS.users,[]),
    saveUsers:(v)=>write(KEYS.users,v),
    getProjects:()=>read(KEYS.projects,[]),
    saveProjects:(v)=>write(KEYS.projects,v),
    getReturns:()=>read(KEYS.returns,[]),
    saveReturns:(v)=>write(KEYS.returns,v),
    getInventory:()=>read(KEYS.inventoryChecks,[]),
    saveInventory:(v)=>write(KEYS.inventoryChecks,v),
    getSettings:()=>read(KEYS.settings,{categories:['سباكة','كهرباء','Post Tension','أدوات ومعدات','أخرى'], units:['قطعة','كرتونة','لفة','متر','كيلو','طن','شيكارة','جردل','لتر','مجموعة','عدد'], lowStockThreshold:10, companyName:'شركة المقاولات'}),
    saveSettings:(v)=>write(KEYS.settings,v),
    getMeta:()=>read(KEYS.meta,{initialized:false}),
    saveMeta:(v)=>write(KEYS.meta,v),
    exportAll:()=>{
      const data={};
      Object.values(KEYS).forEach(k=>{ if(k!==KEYS.currentUser) data[k]=read(k,[]); });
      return data;
    },
    importAll:(data)=>{
      Object.keys(data).forEach(k=>{ if(data[k]!==undefined) write(k,data[k]); });
    },
    clearAll:()=>{
      Object.values(KEYS).forEach(k=>{ if(k!==KEYS.currentUser){ localStorage.removeItem(k); } });
      if(FB){ Object.values(KEYS).forEach(k=>{ if(k!==KEYS.currentUser) FB.ref(FB_ROOT+'/'+k).remove(); }); }
    }
  };
})();

/* ============================================================
   CLOUD SYNC LAYER (المزامنة التلقائية)
   ============================================================ */
const Cloud = {
  syncing: 0,
  setStatus(state){
    const el = document.getElementById('syncIndicator');
    if(!el) return;
    const map = {
      online: {cls:'online', icon:'fa-cloud-upload-alt', text:'متصل - مزامنة تلقائية'},
      syncing:{cls:'syncing', icon:'fa-sync-alt fa-spin', text:'جاري المزامنة...'},
      offline:{cls:'offline', icon:'fa-cloud-slash', text:'غير متصل - حفظ محلي'}
    };
    const m = map[state] || map.offline;
    el.className = 'sync-indicator ' + m.cls;
    el.innerHTML = `<i class="fas ${m.icon}"></i><span>${m.text}</span>`;
  },
  push(key, val){
    if(!fbReady || !FB) return;
    this.syncing++;
    this.setStatus('syncing');
    FB.ref(FB_ROOT+'/'+key).set(val)
      .catch(err=>console.warn('Cloud push failed:', key, err))
      .finally(()=>{
        this.syncing--;
        if(this.syncing<=0) this.setStatus(fbOnline?'online':'offline');
      });
  },
  async pushAll(){
    if(!fbReady || !FB) return;
    try{
      const snap = await FB.ref(FB_ROOT).once('value');
      const cloudData = snap.val();
      const localData = DB.exportAll();
      if(!cloudData || Object.keys(cloudData).length===0){
        console.log('Cloud empty, uploading local data...');
        for(const [k,v] of Object.entries(localData)){
          await FB.ref(FB_ROOT+'/'+k).set(v);
        }
        this.setStatus('online');
      }
    }catch(e){ console.warn('pushAll error:', e); }
  },
  async loadAll(){
    if(!fbReady || !FB) return false;
    try{
      const snap = await FB.ref(FB_ROOT).once('value');
      const data = snap.val();
      if(!data || Object.keys(data).length===0){
        console.log('No cloud data found, using local data');
        return false;
      }
      let loaded = 0;
      Object.keys(data).forEach(k=>{
        if(k===DB.KEYS.currentUser) return;
        if(data[k]!==null && data[k]!==undefined){
          localStorage.setItem(k, JSON.stringify(data[k]));
          loaded++;
        }
      });
      console.log('Loaded', loaded, 'collections from cloud');
      return true;
    }catch(e){
      console.warn('Cloud load failed:', e);
      return false;
    }
  },
  listen(){
    if(!fbReady || !FB) return;
    Object.values(DB.KEYS).forEach(k=>{
      if(k===DB.KEYS.currentUser) return;
      FB.ref(FB_ROOT+'/'+k).on('value', snap=>{
        const val = snap.val();
        if(val!==null && val!==undefined){
          try{
            const current = localStorage.getItem(k);
            const newStr = JSON.stringify(val);
            if(current !== newStr){
              localStorage.setItem(k, newStr);
              if(Router.current){
                if(document.getElementById('app').children.length){
                  if(!document.querySelector('.swal2-container')){
                    setTimeout(()=>{ try{ Router.go(Router.current); }catch(e){} }, 300);
                  }
                }
              }
            }
          }catch(e){}
        }
      });
    });
  }
};

const Utils = {

  formatDateTime:(d)=>{ if(!d) return ''; const dt=new Date(d); return dt.toLocaleDateString('ar-EG')+' '+dt.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}); },
  nowISO:()=> new Date().toISOString(),
  today:()=> new Date().toISOString().split('T')[0],
  escape:(s)=>{ if(s===undefined||s===null) return ''; return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); },
  showLoading:()=> document.getElementById('loadingOverlay').classList.add('show'),

/* ============================================================
   BUSINESS LOGIC
   ============================================================ */
const Stock = {
  calculateBalance(productId){
    const movements = DB.getMovements().filter(m=>m.productId===productId);
    let balance = 0;
    movements.forEach(m=>{
      if(['استلام','مرتجع','تعديل-زيادة','جرد-زيادة'].includes(m.type)) balance += Number(m.quantity);
      else if(['صرف','تعديل-نقص','جرد-نقص'].includes(m.type)) balance -= Number(m.quantity);
      else if(m.type==='جرد') balance = Number(m.balanceAfter);
    });
    return balance;
  },
  getProductBalance(productId){
    const p = DB.getProducts().find(x=>x.id===productId);
    return p ? Number(p.currentQty||0) : 0;
  },
  updateProductQty(productId, delta){
    const products = DB.getProducts();
    const idx = products.findIndex(p=>p.id===productId);
    if(idx===-1) return false;
    products[idx].currentQty = Number(products[idx].currentQty||0) + Number(delta);
    if(products[idx].currentQty < 0) products[idx].currentQty = 0;
    DB.saveProducts(products);
    return products[idx];
  },
  addMovement(data){
    const movements = DB.getMovements();
    const product = DB.getProducts().find(p=>p.id===data.productId);
    const before = product ? Number(product.currentQty||0) : 0;
    const move = {
      id: DB.uid('MOV'),
      date: data.date || Utils.today(),
      time: data.time || new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}),
      type: data.type,
      productId: data.productId,
      productName: product ? product.name : '',
      productCode: product ? product.code : '',
      category: product ? product.category : '',
      quantity: Number(data.quantity),
      unit: product ? product.unit : (data.unit||''),
      person: data.person || '',
      project: data.project || '',
      refNumber: data.refNumber || '',
      balanceBefore: before,
      balanceAfter: before + (['استلام','مرتجع','تعديل-زيادة','جرد-زيادة'].includes(data.type)? Number(data.quantity) : -Number(data.quantity)),
      notes: data.notes || '',
      createdAt: Utils.nowISO()
    };
    if(data.type==='جرد'){
      move.balanceAfter = Number(data.quantity);
      move.quantity = Number(data.quantity) - before;
    }
    movements.push(move);
    DB.saveMovements(movements);
    return move;
  },
  receiveStock(payload){
    const products = DB.getProducts();
    const receipt = {
      id: DB.uid('RCV'),
      receiptNo: payload.receiptData.receiptNo,
      date: payload.receiptData.date,
      supplier: payload.receiptData.supplier,
      poNumber: payload.receiptData.poNumber,
      receiver: payload.receiptData.receiver,
      carNumber: payload.receiptData.carNumber,
      storeLocation: payload.receiptData.storeLocation,
      notes: payload.receiptData.notes,
      items: [],
      createdAt: Utils.nowISO()
    };
    for(const item of payload.items){
      const pIdx = products.findIndex(p=>p.id===item.productId);
      if(pIdx===-1) continue;
      const before = Number(products[pIdx].currentQty||0);
      products[pIdx].currentQty = before + Number(item.quantity);
      if(item.storeLocation) products[pIdx].storeLocation = item.storeLocation;
      receipt.items.push({
        productId:item.productId, productName: products[pIdx].name,
        productCode: products[pIdx].code, quantity:Number(item.quantity),
        unit: products[pIdx].unit, before, after: products[pIdx].currentQty
      });
      Stock.addMovement({
        type:'استلام', productId:item.productId, quantity:item.quantity,
        person: payload.receiptData.receiver, refNumber: payload.receiptData.receiptNo,
        notes: 'إذن استلام', date: payload.receiptData.date
      });
    }
    DB.saveProducts(products);
    const receipts = DB.getReceipts();
    receipts.push(receipt);
    DB.saveReceipts(receipts);
    return receipt;
  },
  issueStock(payload){
    const products = DB.getProducts();
    for(const item of payload.items){
      const p = products.find(x=>x.id===item.productId);
      if(!p) throw new Error('الصنف غير موجود');
      if(Number(item.quantity) > Number(p.currentQty||0)){
        throw new Error(`الكمية الموجودة في المخزن غير كافية للصنف: ${p.name} (المتاح: ${p.currentQty} ${p.unit})`);
      }
    }
    const issue = {
      id: DB.uid('ISS'), issueNo: payload.issueData.issueNo,
      date: payload.issueData.date, time: payload.issueData.time,
      person: payload.issueData.person, jobTitle: payload.issueData.jobTitle,
      department: payload.issueData.department, project: payload.issueData.project,
      location: payload.issueData.location, reason: payload.issueData.reason,
      notes: payload.issueData.notes, items: [], createdAt: Utils.nowISO()
    };
    for(const item of payload.items){
      const pIdx = products.findIndex(p=>p.id===item.productId);
      const before = Number(products[pIdx].currentQty||0);
      products[pIdx].currentQty = before - Number(item.quantity);
      issue.items.push({
        productId:item.productId, productName: products[pIdx].name,
        productCode: products[pIdx].code, quantity:Number(item.quantity),
        unit: products[pIdx].unit, before, after: products[pIdx].currentQty
      });
      Stock.addMovement({
        type:'صرف', productId:item.productId, quantity:item.quantity,
        person: payload.issueData.person, project: payload.issueData.project,
        refNumber: payload.issueData.issueNo, notes: payload.issueData.reason||'صرف',
        date: payload.issueData.date, time: payload.issueData.time
      });
    }
    DB.saveProducts(products);
    const issues = DB.getIssues();
    issues.push(issue);
    DB.saveIssues(issues);
    return issue;
  },
  returnStock(payload){
    const products = DB.getProducts();
    const ret = {
      id: DB.uid('RET'), returnNo: payload.returnNo || DB.uid('RET'),
      date: payload.date, person: payload.person, project: payload.project,
      reason: payload.reason, notes: payload.notes, items: [], createdAt: Utils.nowISO()
    };
    for(const item of payload.items){
      const pIdx = products.findIndex(p=>p.id===item.productId);
      if(pIdx===-1) continue;
      const before = Number(products[pIdx].currentQty||0);
      products[pIdx].currentQty = before + Number(item.quantity);
      ret.items.push({
        productId:item.productId, productName: products[pIdx].name,
        quantity:Number(item.quantity), unit: products[pIdx].unit,
        before, after: products[pIdx].currentQty
      });
      Stock.addMovement({
        type:'مرتجع', productId:item.productId, quantity:item.quantity,
        person: payload.person, project: payload.project,
        refNumber: ret.returnNo, notes: payload.reason||'مرتجع', date: payload.date
      });
    }
    DB.saveProducts(products);
    const returns = DB.getReturns();
    returns.push(ret);
    DB.saveReturns(returns);
    return ret;
  },
  performInventory(productId, actualQty, notes){
    const products = DB.getProducts();
    const pIdx = products.findIndex(p=>p.id===productId);
    if(pIdx===-1) throw new Error('الصنف غير موجود');
    const before = Number(products[pIdx].currentQty||0);
    const diff = Number(actualQty) - before;
    products[pIdx].currentQty = Number(actualQty);
    DB.saveProducts(products);
    const record = {
      id: DB.uid('INV'), productId, productName: products[pIdx].name,
      productCode: products[pIdx].code, registeredQty: before, actualQty: Number(actualQty),
      difference: diff, status: diff===0?'مطابق':(diff>0?'زيادة':'عجز'),
      date: Utils.today(), notes: notes||'', createdAt: Utils.nowISO()
    };
    const checks = DB.getInventory();
    checks.push(record);
    DB.saveInventory(checks);
    Stock.addMovement({
      type:'جرد', productId, quantity: Number(actualQty),
      person: 'الجرد', notes: `جرد: ${record.status} (${diff>0?'+':''}${diff})`,
      refNumber: record.id
    });
    return record;
  },
  getLowStockProducts(){
    return DB.getProducts().filter(p=>{
      const qty = Number(p.currentQty||0);
      const min = Number(p.minQty||0);
      return qty <= min && qty > 0;
    });
  },
  getOutOfStockProducts(){
    return DB.getProducts().filter(p=>Number(p.currentQty||0) <= 0);
  },
  getStatus(product){
    const qty = Number(product.currentQty||0);
    const min = Number(product.minQty||0);
    if(qty <= 0) return {label:'نافد', class:'badge-danger', icon:'🔴'};
    if(qty <= min) return {label:'منخفض', class:'badge-warning', icon:'🟡'};
    return {label:'متوفر', class:'badge-success', icon:'🟢'};
  },
  recalcProductQty(productId){
    const movements = DB.getMovements().filter(m=>m.productId===productId)
      .sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));
    let balance = 0;
    movements.forEach(m=>{
      if(['استلام','مرتجع','تعديل-زيادة','جرد-زيادة'].includes(m.type)){
        balance += Number(m.quantity||0);
      } else if(['صرف','تعديل-نقص','جرد-نقص'].includes(m.type)){
        balance -= Number(m.quantity||0);
      } else if(m.type==='جرد'){
        balance = Number(m.balanceAfter||0);
      }
    });
    if(balance < 0) balance = 0;
    const products = DB.getProducts();
    const idx = products.findIndex(p=>p.id===productId);
    if(idx!==-1){
      products[idx].currentQty = balance;
      DB.saveProducts(products);
    }
    return balance;
  },
  deleteMovement(movementId){
    const movements = DB.getMovements();
    const move = movements.find(m=>m.id===movementId);
    if(!move) throw new Error('الحركة غير موجودة');
    const productId = move.productId;
    const filtered = movements.filter(m=>m.id!==movementId);
    DB.saveMovements(filtered);
    const newBalance = Stock.recalcProductQty(productId);
    return {move, newBalance};
  },
  deleteMovements(movementIds){
    if(!Array.isArray(movementIds) || !movementIds.length) return {count:0, products:[]};
    const ids = new Set(movementIds);
    const movements = DB.getMovements();
    const affectedProducts = new Set();
    const filtered = movements.filter(m=>{
      if(ids.has(m.id)){
        if(m.productId) affectedProducts.add(m.productId);
        return false;
      }
      return true;
    });
    DB.saveMovements(filtered);
    const results = [];
    affectedProducts.forEach(pid=>{
      const bal = Stock.recalcProductQty(pid);
      results.push({productId: pid, newBalance: bal});
    });
    return {count: ids.size, products: results};
  },
  deleteAllMovements(alsoResetProducts=false){
    const movements = DB.getMovements();
    const count = movements.length;
    DB.saveMovements([]);
    if(alsoResetProducts){
      const products = DB.getProducts().map(p=>({...p, currentQty: 0}));
      DB.saveProducts(products);
    } else {
      DB.getProducts().forEach(p=>Stock.recalcProductQty(p.id));
    }
    return {count};
  },
  deleteProductPermanently(productId){
    const products = DB.getProducts();
    const product = products.find(p=>p.id===productId);
    if(!product) throw new Error('الصنف غير موجود');
    DB.saveProducts(products.filter(p=>p.id!==productId));
    const movements = DB.getMovements().filter(m=>m.productId!==productId);
    DB.saveMovements(movements);
    return {product};
  },
  deleteProductsPermanently(productIds){
    if(!Array.isArray(productIds) || !productIds.length) return {count:0};
    const ids = new Set(productIds);
    const products = DB.getProducts();
    const deleted = products.filter(p=>ids.has(p.id));
    DB.saveProducts(products.filter(p=>!ids.has(p.id)));
    const movements = DB.getMovements().filter(m=>!ids.has(m.productId));
    DB.saveMovements(movements);
    return {count: deleted.length, products: deleted};
  },
  resetProductsQty(productIds){
    if(!Array.isArray(productIds) || !productIds.length) return {count:0};
    const ids = new Set(productIds);
    const products = DB.getProducts();
    let count = 0;
    products.forEach(p=>{
      if(ids.has(p.id)){ p.currentQty = 0; count++; }
    });
    DB.saveProducts(products);
    return {count};
  },
  deleteAllProducts(){
    const count = DB.getProducts().length;
    DB.saveProducts([]);
    DB.saveMovements([]);
    return {count};
  }
};

const Auth = {
  ROLES:{
    Admin:{name:'مدير النظام', perms:['view','add','edit','delete','receive','issue','return','inventory','backup','users','projects']},
    Storekeeper:{name:'أمين مخزن', perms:['view','add','edit','receive','issue','return','inventory']},
    Viewer:{name:'مشاهد', perms:['view']}
  },
  getCurrent(){ return DB.get(DB.KEYS.currentUser, null) || {name:'مدير النظام', role:'Admin'}; },
  setCurrent(user){ DB.set(DB.KEYS.currentUser, user); },
  can(perm){
    const u = Auth.getCurrent();
    const role = Auth.ROLES[u.role] || Auth.ROLES.Viewer;
    return role.perms.includes(perm);
  },
  requirePerm(perm){
    if(!Auth.can(perm)){
      Swal.fire({icon:'error',title:'غير مصرح',text:'ليس لديك صلاحية للقيام بهذا الإجراء'});
      return false;
    }
    return true;
  }
};

Pages.dashboard.after = () => {
  const ctx = document.getElementById('mainChart');
  if(!ctx) return;
  const movements = DB.getMovements();
  const days=[], receivedData=[], issuedData=[], balanceData=[];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const key = d.toISOString().split('T')[0];
    days.push(d.toLocaleDateString('ar-EG',{weekday:'short',day:'numeric'}));
    const dayMoves = movements.filter(m=>m.date===key);
    const rec = dayMoves.filter(m=>['استلام','مرتجع'].includes(m.type)).reduce((s,m)=>s+Number(m.quantity||0),0);
    const iss = dayMoves.filter(m=>m.type==='صرف').reduce((s,m)=>s+Number(m.quantity||0),0);
    receivedData.push(rec); issuedData.push(iss); balanceData.push(rec-iss);
  }
  new Chart(ctx,{
    type:'bar',
    data:{
      labels:days,
      datasets:[
        {label:'وارد',data:receivedData,backgroundColor:'rgba(39,174,96,.75)',borderRadius:6},
        {label:'منصرف',data:issuedData,backgroundColor:'rgba(231,76,60,.75)',borderRadius:6},
        {label:'صافي',data:balanceData,type:'line',borderColor:'#3498db',backgroundColor:'rgba(52,152,219,.15)',tension:.35,fill:true,borderWidth:3,pointRadius:4,pointBackgroundColor:'#3498db'}
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{position:'top',labels:{font:{family:'Cairo',weight:'600'}}}},
      scales:{y:{beginAtZero:true,ticks:{font:{family:'Cairo'}}},x:{ticks:{font:{family:'Cairo'}}}}
    }
  });
};

    if(statusFilter){
      list = list.filter(p=>{

        if(statusFilter==='out') return qty<=0;
        if(statusFilter==='low') return qty>0 && qty<=min;

        document.getElementById('issPerson').addEventListener('change', e=>{
          if(e.target.value==='__other__'){
            Swal.fire({input:'text',title:'اسم الشخص',showCancelButton:true}).then(r=>{
              if(r.isConfirmed && r.value){
                const opt = document.createElement('option');
                opt.value = r.value; opt.textContent = r.value; opt.selected = true;
                e.target.insertBefore(opt, e.target.firstChild);
              } else { e.target.value=''; }
            });
          }
        });
      },
      preConfirm:()=>{
        const person = document.getElementById('issPerson').value;
        const qty = Number(document.getElementById('issQty').value);
        if(!person || person==='__other__'){ Swal.showValidationMessage('يرجى اختيار الشخص'); return false; }
        if(!qty || qty<=0){ Swal.showValidationMessage('الكمية غير صحيحة'); return false; }
        if(qty > Number(p.currentQty)){ Swal.showValidationMessage('الكمية الموجودة في المخزن غير كافية'); return false; }
        return {
          person, qty,
          project:document.getElementById('issProject').value,
          reason:document.getElementById('issReason').value,
          notes:document.getElementById('issNotes').value
        };
      }
    }).then(r=>{
      if(!r.isConfirmed) return;
      Utils.showLoading();
      setTimeout(()=>{
        try{
          Stock.updateProductQty(id, -r.value.qty);
          Stock.addMovement({
            type:'صرف', productId:id, quantity:r.value.qty,
            person:r.value.person, project:r.value.project,
            refNumber:DB.uid('ISS'), notes:r.value.reason||'صرف'
          });

          Utils.toast('success','تم الصرف بنجاح');

      },300);
    });
  },
  history(id){
    const p = DB.getProducts().find(x=>x.id===id);
    if(!p) return;
    const moves = DB.getMovements().filter(m=>m.productId===id).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
    Swal.fire({
      title:`سجل حركة: ${Utils.escape(p.name)}`,
      html: moves.length ? `
      <div style="max-height:400px;overflow-y:auto;text-align:right">
        <table class="table table-sm table-bordered" style="font-size:12.5px">
          <thead><tr><th>التاريخ</th><th>النوع</th><th>الكمية</th><th>الرصيد</th><th>الشخص</th></tr></thead>
          <tbody>
            ${moves.map(m=>`<tr>
              <td>${Utils.formatDate(m.date)}<br><small>${m.time||''}</small></td>

              <td>${m.quantity} ${Utils.escape(m.unit)}</td>
              <td><strong>${m.balanceAfter}</strong></td>
              <td><small>${Utils.escape(m.person||'-')}</small></td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>` : '<p>لا توجد حركات</p>',
      width:'700px', confirmButtonText:'إغلاق', confirmButtonColor:'#0f4c81'
    });
  },
  remove(id){
    if(!Auth.requirePerm('delete')) return;

    if(!p) return;
    Utils.confirmDelete(`سيتم حذف الصنف "${p.name}" بشكل نهائي`).then(r=>{
      if(!r.isConfirmed) return;
      const products = DB.getProducts().filter(x=>x.id!==id);

      Products.render();
    });

          if(pid && qty>0) items.push({productId:pid, quantity:qty, storeLocation:loc});
        });
        if(items.length===0){ Swal.showValidationMessage('يرجى إضافة صنف واحد على الأقل'); return false; }

      </div>`,

      Router.go('receipts');
    });
  }
};

    order:[[2,'desc']],
    columnDefs:[
      {targets:[0,14],orderable:false}
    ]
  });
  Movements.dt = dt;
  const apply = ()=>{
    dt.column(4).search(document.getElementById('movType').value);
    dt.column(6).search(document.getElementById('movCategory').value);
    $.fn.dataTable.ext.search.push(function(settings,data,dataIndex){
      const from = document.getElementById('movFrom').value;
      const to = document.getElementById('movTo').value;
      if(!from && !to) return true;
      const d = data[2];
      const parts = d.split('/');
      const dateStr = parts.length===3 ? `${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}` : '';
      if(from && dateStr < from) return false;
      if(to && dateStr > to) return false;
      return true;
    });
    dt.draw();
  };
  ['movType','movCategory','movFrom','movTo'].forEach(id=>{
    document.getElementById(id).addEventListener('change', apply);
  });
};

const WhoTook = {
  dt:null,
  apply(){
    const person = document.getElementById('wtPerson').value;
    const project = document.getElementById('wtProject').value;
    const category = document.getElementById('wtCategory').value;
    const productId = document.getElementById('wtProduct').value;
    const from = document.getElementById('wtFrom').value;
    const to = document.getElementById('wtTo').value;
    const issues = DB.getIssues();
    let rows = [];
    issues.forEach(iss=>{
      if(person && iss.person !== person) return;
      if(project && iss.project !== project) return;
      if(from && iss.date < from) return;
      if(to && iss.date > to) return;
      (iss.items||[]).forEach(it=>{
        if(category){
          const p = DB.getProducts().find(x=>x.id===it.productId);
          if(!p || p.category !== category) return;
        }
        if(productId && it.productId !== productId) return;
        rows.push({
          person: iss.person, date: iss.date, time: iss.time||'',
          productName: it.productName, productCode: it.productCode||'',
          quantity: it.quantity, unit: it.unit, project: iss.project,
          reason: iss.reason, issueNo: iss.issueNo
        });
      });
    });
    if(this.dt){ this.dt.destroy(); }
    const tbody = document.querySelector('#wtTable tbody');
    tbody.innerHTML = rows.map(r=>`
      <tr>
        <td><strong>${Utils.escape(r.person)}</strong></td>
        <td>${Utils.formatDate(r.date)} <small>${r.time||''}</small></td>
        <td>${Utils.escape(r.productName)}<br><small class="text-muted">${Utils.escape(r.productCode)}</small></td>
        <td><strong>${r.quantity}</strong></td>
        <td>${Utils.escape(r.unit)}</td>
        <td>${Utils.escape(r.project||'-')}</td>
        <td><small>${Utils.escape(r.reason||'-')}</small></td>
        <td><small>${Utils.escape(r.issueNo||'-')}</small></td>
      </tr>`).join('');
    this.dt = $('#wtTable').DataTable({
      pageLength:25, language:{search:'بحث:',lengthMenu:'عرض _MENU_',info:'صفحة _PAGE_ من _PAGES_',zeroRecords:'لا توجد نتائج',paginate:{next:'التالي',previous:'السابق'}},
      order:[[1,'desc']]
    });
    const total = rows.reduce((s,r)=>s+Number(r.quantity),0);
    const uniquePersons = new Set(rows.map(r=>r.person)).size;
    document.getElementById('wtSummary').innerHTML = `
      <div class="row g-2">
        <div class="col-md-4">${UI.statCard('fa-list','bg-grad-blue',rows.length,'عدد العمليات')}</div>
        <div class="col-md-4">${UI.statCard('fa-cubes','bg-grad-orange',total,'إجمالي الكميات')}</div>
        <div class="col-md-4">${UI.statCard('fa-users','bg-grad-green',uniquePersons,'عدد الأشخاص')}</div>
      </div>`;
  },
  reset(){
    ['wtPerson','wtProject','wtCategory','wtProduct','wtFrom','wtTo'].forEach(id=>document.getElementById(id).value='');
    this.apply();
  }
};

const Balance = {
  onCheckChange(){
    const selected = document.querySelectorAll('.bal-checkbox:checked');
    const count = selected.length;
    const toolbar = document.getElementById('balanceToolbar');
    const countEl = document.getElementById('balanceSelectedCount');
    if(!toolbar) return;
    if(count > 0){
      toolbar.classList.remove('hidden');
      if(countEl) countEl.textContent = count;
    } else {
      toolbar.classList.add('hidden');
    }
    document.querySelectorAll('#balanceTable tbody tr').forEach(tr=>{
      const cb = tr.querySelector('.bal-checkbox');
      if(cb && cb.checked) tr.classList.add('row-selected');
      else tr.classList.remove('row-selected');
    });
    const allCb = document.getElementById('balSelectAll');
    const allCbs = document.querySelectorAll('.bal-checkbox');
    if(allCb && allCbs.length){
      allCb.checked = (count === allCbs.length && count > 0);
    }

    document.querySelectorAll('.bal-checkbox').forEach(cb=>cb.checked = el.checked);
    this.onCheckChange();

const Inventory = {
  openForm(){
    if(!Auth.requirePerm('inventory')) return;
    const products = DB.getProducts();
    Swal.fire({
      title:'جرد جديد',
      html:`
      <div class="text-end" style="font-size:13px">
        <label class="form-label">اختر الصنف *</label>
        <select id="invProduct" class="form-select mb-2">
          <option value="">-- اختر --</option>
          ${products.map(p=>`<option value="${p.id}" data-qty="${p.currentQty}" data-unit="${p.unit}">${Utils.escape(p.code)} - ${Utils.escape(p.name)} (${p.currentQty} ${p.unit})</option>`).join('')}
        </select>
        <div id="invInfo" class="alert alert-info py-2" style="display:none">
          الكمية المسجلة: <strong id="invRegQty">0</strong> <span id="invUnit"></span>
        </div>
        <label class="form-label">الكمية الفعلية بالمخزن *</label>
        <input id="invActual" type="number" class="form-control mb-2" min="0">
        <label class="form-label">ملاحظات</label>
        <textarea id="invNotes" class="form-control" rows="2"></textarea>
      </div>`,
      showCancelButton:true, confirmButtonText:'تنفيذ الجرد', cancelButtonText:'إلغاء', confirmButtonColor:'#f39c12',
      didOpen:()=>{
        document.getElementById('invProduct').addEventListener('change', e=>{
          const opt = e.target.options[e.target.selectedIndex];
          if(e.target.value){
            document.getElementById('invRegQty').textContent = opt.dataset.qty;
            document.getElementById('invUnit').textContent = opt.dataset.unit;
            document.getElementById('invInfo').style.display = 'block';
          } else {
            document.getElementById('invInfo').style.display = 'none';
          }
        });
      },
      preConfirm:()=>{
        const pid = document.getElementById('invProduct').value;
        const actual = document.getElementById('invActual').value;
        if(!pid){ Swal.showValidationMessage('يرجى اختيار الصنف'); return false; }
        if(actual==='' || Number(actual)<0){ Swal.showValidationMessage('الكمية الفعلية غير صحيحة'); return false; }
        return { productId: pid, actualQty: Number(actual), notes: document.getElementById('invNotes').value };
      }
    }).then(r=>{
      if(!r.isConfirmed) return;
      Utils.showLoading();
      setTimeout(()=>{
        try{
          const record = Stock.performInventory(r.value.productId, r.value.actualQty, r.value.notes);
          Utils.hideLoading();
          Swal.fire({icon:'success',title:'تم الجرد',html:`الحالة: <strong>${record.status}</strong><br>الفرق: ${record.difference>0?'+':''}${record.difference}`,timer:2200,showConfirmButton:false});
          Router.go('inventory');
        }catch(err){ Utils.hideLoading(); Swal.fire('خطأ',err.message,'error'); }
      },400);
    });
  }
};

    if(type==='stock'){
      title = 'تقرير المخزون الحالي';
      headers = ['الكود','الصنف','التصنيف','الوحدة','الرصيد','الحد الأدنى','الحالة'];
      rows = DB.getProducts().map(p=>[p.code, p.name, p.category, p.unit, p.currentQty, p.minQty, Stock.getStatus(p).label]);
    } else if(type==='out'){
      title = 'تقرير الأصناف النافدة';
      headers = ['الكود','الصنف','التصنيف','الوحدة','الحد الأدنى'];
      rows = Stock.getOutOfStockProducts().map(p=>[p.code, p.name, p.category, p.unit, p.minQty]);
    } else if(type==='low'){
      title = 'تقرير الأصناف منخفضة المخزون';
      headers = ['الكود','الصنف','التصنيف','الوحدة','الرصيد','الحد الأدنى'];
      rows = Stock.getLowStockProducts().map(p=>[p.code, p.name, p.category, p.unit, p.currentQty, p.minQty]);
    } else if(type==='receipts'){
      title = 'تقرير الوارد';
      headers = ['رقم الإذن','التاريخ','المورد','أمر الشراء','الصنف','الكمية','الوحدة','المستلم'];
      DB.getReceipts().forEach(r=>{
        if(from && r.date < from) return;
        if(to && r.date > to) return;
        (r.items||[]).forEach(it=>{
          rows.push([r.receiptNo, r.date, r.supplier||'-', r.poNumber||'-', it.productName, it.quantity, it.unit, r.receiver||'-']);
        });
      });
    } else if(type==='issues'){
      title = 'تقرير المنصرف';
      headers = ['رقم الإذن','التاريخ','الشخص','المشروع','الصنف','الكمية','الوحدة','السبب'];
      DB.getIssues().forEach(i=>{
        if(from && i.date < from) return;
        if(to && i.date > to) return;
        (i.items||[]).forEach(it=>{
          rows.push([i.issueNo, i.date, i.person, i.project, it.productName, it.quantity, it.unit, i.reason||'-']);
        });
      });
    } else if(type==='product'){
      const pid = document.getElementById('repProduct')?.value;
      const p = DB.getProducts().find(x=>x.id===pid);
      title = `تقرير حركة الصنف: ${p?p.name:''}`;
      headers = ['التاريخ','الوقت','النوع','الكمية','الرصيد قبل','الرصيد بعد','الشخص','رقم الإذن','ملاحظات'];
      DB.getMovements().filter(m=>m.productId===pid).forEach(m=>{
        if(from && m.date < from) return;
        if(to && m.date > to) return;
        rows.push([m.date, m.time||'', m.type, m.quantity+' '+(m.unit||''), m.balanceBefore, m.balanceAfter, m.person||'-', m.refNumber||'-', m.notes||'-']);
      });
    } else if(type==='person'){
      const person = document.getElementById('repPerson')?.value;
      title = `تقرير سحوبات: ${person}`;
      headers = ['التاريخ','الوقت','الصنف','الكمية','الوحدة','المشروع','السبب','رقم الإذن'];
      DB.getIssues().filter(i=>i.person===person).forEach(i=>{
        if(from && i.date < from) return;
        if(to && i.date > to) return;
        (i.items||[]).forEach(it=>{
          rows.push([i.date, i.time||'', it.productName, it.quantity, it.unit, i.project, i.reason||'-', i.issueNo]);
        });
      });
    } else if(type==='project'){
      const project = document.getElementById('repProject')?.value;
      title = `تقرير سحوبات المشروع: ${project}`;
      headers = ['التاريخ','الشخص','الصنف','الكمية','الوحدة','السبب','رقم الإذن'];
      DB.getIssues().filter(i=>i.project===project).forEach(i=>{
        if(from && i.date < from) return;
        if(to && i.date > to) return;
        (i.items||[]).forEach(it=>{
          rows.push([i.date, i.person, it.productName, it.quantity, it.unit, i.reason||'-', i.issueNo]);
        });
      });
    } else if(type==='inventory'){
      title = 'تقرير الجرد';
      headers = ['التاريخ','الصنف','المسجل','الفعلي','الفرق','الحالة','ملاحظات'];
      DB.getInventory().forEach(c=>{
        if(from && c.date < from) return;
        if(to && c.date > to) return;
        rows.push([c.date, c.productName, c.registeredQty, c.actualQty, (c.difference>0?'+':'')+c.difference, c.status, c.notes||'-']);
      });
    } else if(type==='returns'){
      title = 'تقرير المرتجعات';
      headers = ['رقم المرتجع','التاريخ','الشخص','المشروع','الصنف','الكمية','الوحدة','السبب'];
      DB.getReturns().forEach(r=>{
        if(from && r.date < from) return;
        if(to && r.date > to) return;
        (r.items||[]).forEach(it=>{
          rows.push([r.returnNo, r.date, r.person, r.project||'-', it.productName, it.quantity, it.unit, r.reason||'-']);
        });
      });
    }

    this.currentRows = rows;
    this.currentHeaders = headers;

    box.innerHTML = `
      <div style="border:1px solid #e8eef5;border-radius:12px;padding:18px;background:#fff">
        <div style="text-align:center;margin-bottom:18px;border-bottom:2px solid var(--primary);padding-bottom:12px">
          <h5 style="font-weight:800;color:var(--primary);margin:0">${title}</h5>
          <small style="color:#64748b">مخزني VIP - ${new Date().toLocaleDateString('ar-EG')}</small>
        </div>
        ${rows.length ? `
        <div class="table-responsive">
          <table class="table table-bordered table-sm" style="font-size:12.5px">
            <thead style="background:#f0f6fc"><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
            <tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${Utils.escape(c)}</td>`).join('')}</tr>`).join('')}</tbody>
          </table>
        </div>
        <div style="margin-top:12px;text-align:left;font-size:12px;color:#64748b">
          إجمالي السجلات: <strong>${rows.length}</strong>
        </div>` : UI.emptyState('لا توجد بيانات','جرب تغيير الفلاتر أو الفترة الزمنية')}
      </div>`;
  },
  exportCSV(){
    if(!this.currentRows.length){ Utils.toast('warning','لا توجد بيانات للتصدير'); return; }
    const csv = [this.currentHeaders.join(','), ...this.currentRows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(','))].join('\n');
    const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'report_'+Date.now()+'.csv';
    link.click();
    Utils.toast('success','تم تصدير التقرير');
  }
};

const Settings = {
  saveUser(){
    const name = document.getElementById('setUserName').value.trim();
    const role = document.getElementById('setUserRole').value;
    if(!name){ Utils.toast('error','يرجى إدخال الاسم'); return; }
    Auth.setCurrent({name, role});
    Router.refreshUser();
    Utils.toast('success','تم حفظ الإعدادات');
  },
  manualSync(){
    if(!fbReady){ Utils.toast('error','Firebase غير مهيأ'); return; }
    Cloud.pushAll().then(()=>{
      Utils.toast('success','تمت المزامنة');
      Router.go('settings');
    });
  },
  async pushToCloud(){
    if(!fbReady){ Utils.toast('error','Firebase غير مهيأ'); return; }
    const r = await Utils.confirmDelete('سيتم استبدال البيانات السحابية بالبيانات المحلية. متابعة؟');
    if(!r.isConfirmed) return;
    Utils.showLoading();
    const data = DB.exportAll();
    for(const [k,v] of Object.entries(data)){
      try{ await FB.ref(FB_ROOT+'/'+k).set(v); }catch(e){ console.warn(e); }
    }
    Utils.hideLoading();
    Utils.toast('success','تم الرفع للسحابة');
    Router.go('settings');
  },
  async pullFromCloud(){
    if(!fbReady){ Utils.toast('error','Firebase غير مهيأ'); return; }
    const r = await Utils.confirmDelete('سيتم استبدال البيانات المحلية بالبيانات السحابية. متابعة؟');
    if(!r.isConfirmed) return;
    Utils.showLoading();
    const ok = await Cloud.loadAll();
    Utils.hideLoading();
    if(ok){
      Utils.toast('success','تم التحميل من السحابة');
      Router.go('dashboard');
    } else {
      Utils.toast('warning','لا توجد بيانات في السحابة');
    }
  },
  exportBackup(){
    const data = DB.exportAll();
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'MakhzanyVIP_Backup_'+new Date().toISOString().split('T')[0]+'.json';
    link.click();
    Utils.toast('success','تم تصدير النسخة الاحتياطية');
  },
  importBackup(e){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const data = JSON.parse(ev.target.result);
        Utils.confirmDelete('سيتم استبدال جميع البيانات الحالية. هل تريد المتابعة؟').then(r=>{
          if(!r.isConfirmed) return;
          Utils.showLoading();
          setTimeout(()=>{
            DB.importAll(data);
            Utils.hideLoading();
            Swal.fire({icon:'success',title:'تم الاستيراد',timer:1500,showConfirmButton:false});
            Router.go('dashboard');
          },400);
        });
      }catch(err){ Utils.toast('error','ملف غير صالح'); }
    };
    reader.readAsText(file);
    e.target.value = '';
  },
  seedDemo(){
    Utils.confirmDelete('سيتم استبدال البيانات الحالية بالبيانات التجريبية').then(r=>{
      if(!r.isConfirmed) return;
      Utils.showLoading();
      setTimeout(()=>{
        DB.clearAll();
        Seed.init();
        Utils.hideLoading();
        Utils.toast('success','تم استعادة البيانات التجريبية');
        Router.go('dashboard');
      },500);
    });
  },
  clearAll(){
    Utils.confirmDelete('سيتم حذف كل البيانات نهائيًا (محلياً وسحابياً)! هل أنت متأكد؟').then(r=>{
      if(!r.isConfirmed) return;
      DB.clearAll();
      Seed.init();
      Utils.toast('success','تم حذف البيانات');
      Router.go('dashboard');
    });
  },
  addCat(){
    const v = document.getElementById('newCat').value.trim();
    if(!v) return;
    const s = DB.getSettings();
    if(s.categories.includes(v)){ Utils.toast('warning','موجود بالفعل'); return; }
    s.categories.push(v); DB.saveSettings(s);
    Router.go('settings');
  },
  removeCat(i){
    const s = DB.getSettings();
    s.categories.splice(i,1); DB.saveSettings(s);
    Router.go('settings');
  },
  addUnit(){
    const v = document.getElementById('newUnit').value.trim();
    if(!v) return;
    const s = DB.getSettings();
    if(s.units.includes(v)){ Utils.toast('warning','موجود بالفعل'); return; }
    s.units.push(v); DB.saveSettings(s);
    Router.go('settings');
  },
  removeUnit(i){
    const s = DB.getSettings();
    s.units.splice(i,1); DB.saveSettings(s);
    Router.go('settings');
  }
};

/* ============================================================
   ROUTER
   ============================================================ */
const Router = {
  current: 'dashboard',
  go(page){
    if(!Pages[page]) page = 'dashboard';
    this.current = page;
    UI.setActive(page);
    const container = document.getElementById('app');
    container.innerHTML = '';
    container.appendChild(this.buildPage(page));
    if(Pages[page].after) Pages[page].after();
    document.getElementById('sidebar').classList.remove('show');
    document.getElementById('sidebarOverlay').classList.remove('show');
    window.scrollTo({top:0,behavior:'smooth'});
  },
  buildPage(page){
    const html = Pages[page]();
    const div = document.createElement('div');
    div.innerHTML = html;
    return div.firstElementChild;
  },
  refreshUser(){
    const u = Auth.getCurrent();
    document.getElementById('currentUserName').textContent = u.name;
    document.getElementById('currentUserRole').textContent = u.role;
    document.getElementById('currentUserAvatar').textContent = u.name.charAt(0);
  }
};

/* ============================================================
   GLOBAL SEARCH
   ============================================================ */
const GlobalSearch = {
  init(){
    const input = document.getElementById('globalSearch');
    const results = document.getElementById('searchResults');
    let timer;
    input.addEventListener('input', ()=>{
      clearTimeout(timer);
      timer = setTimeout(()=>{
        const q = input.value.trim().toLowerCase();
        if(!q){ results.classList.remove('show'); return; }
        this.search(q);
      }, 200);
    });
    document.addEventListener('click', e=>{
      if(!e.target.closest('.search-box')) results.classList.remove('show');
    });
  },
  search(q){
    const results = document.getElementById('searchResults');
    const items = [];
    DB.getProducts().filter(p=>p.name.toLowerCase().includes(q)||p.code.toLowerCase().includes(q)).slice(0,5).forEach(p=>{
      items.push({type:'صنف', title:p.name, sub:`${p.code} - رصيد: ${p.currentQty} ${p.unit}`, action:()=>{ Router.go('products'); setTimeout(()=>Products.view(p.id),400); }});
    });
    DB.getUsers().filter(u=>u.name.toLowerCase().includes(q)).slice(0,3).forEach(u=>{
      items.push({type:'شخص', title:u.name, sub:`${u.jobTitle||''} - ${u.project||''}`, action:()=>Router.go('users')});
    });
    DB.getProjects().filter(p=>p.name.toLowerCase().includes(q)||p.code.toLowerCase().includes(q)).slice(0,3).forEach(p=>{
      items.push({type:'مشروع', title:p.name, sub:p.code, action:()=>Router.go('projects')});
    });
    DB.getIssues().filter(i=>i.person?.toLowerCase().includes(q)||i.project?.toLowerCase().includes(q)).slice(0,3).forEach(i=>{
      items.push({type:'صرف', title:`إذن ${i.issueNo} - ${i.person}`, sub:`${i.project} - ${i.date}`, action:()=>{ Router.go('issues'); setTimeout(()=>Issues.view(i.id),400); }});
    });
    if(!items.length){
      results.innerHTML = `<div class="search-result-item text-center text-muted">لا توجد نتائج</div>`;
    } else {
      results.innerHTML = items.map((it,i)=>`
        <div class="search-result-item" data-idx="${i}">
          <div class="title"><span class="badge bg-secondary me-1" style="font-size:10px">${it.type}</span> ${Utils.escape(it.title)}</div>
          <div class="sub">${Utils.escape(it.sub)}</div>
        </div>`).join('');
      results.querySelectorAll('.search-result-item').forEach(el=>{
        el.addEventListener('click', ()=>{
          const idx = Number(el.dataset.idx);
          items[idx].action();
          results.classList.remove('show');
          document.getElementById('globalSearch').value = '';
        });
      });
    }
    results.classList.add('show');
  }
};

/* ============================================================
   INIT
   ============================================================ */
async function boot(){
  try {
    initFirebase();
    if(fbReady){
      Cloud.setStatus('syncing');
      const loadedFromCloud = await Cloud.loadAll();
      if(!loadedFromCloud){
        await Cloud.pushAll();
      }
      Cloud.setStatus(fbOnline?'online':'offline');
      Cloud.listen();
    } else {
      Cloud.setStatus('offline');
    }
    Seed.init();
    Router.refreshUser();
    document.querySelectorAll('.sidebar .nav-link').forEach(btn=>{
      btn.addEventListener('click', ()=>Router.go(btn.dataset.page));
    });
    document.getElementById('toggleBtn').addEventListener('click', ()=>{
      document.getElementById('sidebar').classList.toggle('show');
      document.getElementById('sidebarOverlay').classList.toggle('show');
    });
    document.getElementById('sidebarOverlay').addEventListener('click', ()=>{
      document.getElementById('sidebar').classList.remove('show');
      document.getElementById('sidebarOverlay').classList.remove('show');
    });
    GlobalSearch.init();
    Router.go('dashboard');
  } catch (err) {
    console.error('Boot error:', err);
    document.getElementById('app').innerHTML = `
      <div class="page">
        <div class="alert alert-danger" style="margin:20px">
          <h4><i class="fas fa-exclamation-triangle"></i> حدث خطأ في تحميل التطبيق</h4>
          <p><strong>الخطأ:</strong> ${err.message}</p>
          <p><strong>الملف:</strong> ${err.fileName || 'غير معروف'}</p>
          <p><strong>السطر:</strong> ${err.lineNumber || 'غير معروف'}</p>
          <button class="btn btn-primary" onclick="location.reload()">
            <i class="fas fa-redo"></i> إعادة المحاولة
          </button>
        </div>
      </div>
    `;
  }
}

document.addEventListener('DOMContentLoaded', boot);
